<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0e14">
  <title>NBA海克斯王朝</title>
  <style>
    :root{--bg:#0b0e14;--panel:#121722;--panel2:#192131;--line:#2a3447;--text:#f5f7fb;--muted:#98a4b8;--cyan:#39d9ff;--blue:#4c78ff;--gold:#f1bd55;--purple:#c36cff;--good:#52d99b;--bad:#ff6f75;--safe:env(safe-area-inset-bottom,0px)}
    .share-preview{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;background:rgba(3,6,12,.9)}.share-preview-card{width:min(420px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.share-preview img{display:block;width:100%;height:auto;border-radius:10px}.share-preview p{margin:12px 0;color:var(--muted);font-size:12px;text-align:center}.share-preview-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.share-preview-actions a{display:grid;place-items:center;text-decoration:none}
    *{box-sizing:border-box}html{min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}body{min-height:100vh;min-height:100dvh;margin:0;background:radial-gradient(circle at 80% -10%,#203e70 0,transparent 35%),var(--bg)}button,a{font:inherit}button{touch-action:manipulation}.app{width:min(1040px,100%);margin:auto;padding:16px 16px calc(90px + var(--safe))}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{margin:0;font-size:18px;letter-spacing:.08em}.eyebrow{color:var(--cyan);font-size:10px;font-weight:800;letter-spacing:.18em}.back{color:var(--muted);text-decoration:none;font-size:12px}.panel{overflow:hidden;border:1px solid var(--line);border-radius:20px;background:rgba(18,23,34,.96);box-shadow:0 22px 70px rgba(0,0,0,.28)}.hero{padding:28px;background:linear-gradient(135deg,#172641,#101722 64%)}.hero h1{max-width:700px;margin:8px 0 12px;font-size:clamp(36px,8vw,78px);line-height:.92;letter-spacing:-.06em}.hero p{max-width:660px;margin:0;color:var(--muted);font-size:13px;line-height:1.7}.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.primary,.ghost,.choice-btn,.mini{min-height:46px;padding:0 16px;border:1px solid var(--line);border-radius:12px;color:var(--text);background:var(--panel2);cursor:pointer}.primary{border-color:var(--cyan);color:#071019;background:var(--cyan);font-weight:900}.ghost{background:transparent}.primary:disabled,.ghost:disabled,.mini:disabled{opacity:.4;cursor:default}.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:17px 18px;border-bottom:1px solid var(--line)}.section-head h2{margin:0;font-size:17px}.section-head span{color:var(--muted);font-size:10px}.content{padding:16px}.offer-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.player-card,.hex-card{position:relative;min-width:0;padding:16px;border:1px solid var(--line);border-radius:17px;color:var(--text);background:linear-gradient(160deg,#1a2232,#10151f);text-align:left;cursor:pointer}.player-card:active,.hex-card:active{transform:scale(.985)}.player-card .season{color:var(--cyan);font-size:10px;font-weight:900}.player-card h3,.hex-card h3{margin:8px 0 5px;font-size:18px}.player-card p,.hex-card p{min-height:34px;margin:0;color:var(--muted);font-size:10px;line-height:1.55}.tier{display:inline-flex;margin-top:10px;padding:4px 7px;border-radius:999px;color:#0b0e14;background:var(--gold);font-size:9px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:14px;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:var(--line)}.stats span{padding:8px 3px;background:#111722;text-align:center;font-size:9px}.stats b{display:block;margin-top:3px;font-size:14px}.hex-card.SILVER{border-color:#93a2b9}.hex-card.GOLD{border-color:var(--gold);box-shadow:inset 0 3px 0 var(--gold)}.hex-card.PRISMATIC{border-color:var(--purple);box-shadow:inset 0 3px 0 var(--purple),0 0 26px rgba(195,108,255,.16)}.quality{font-size:9px;font-weight:900;letter-spacing:.12em}.SILVER .quality{color:#bcc7d7}.GOLD .quality{color:var(--gold)}.PRISMATIC .quality{color:var(--purple)}.progress{display:flex;gap:5px}.progress i{width:24px;height:5px;border-radius:999px;background:#2b3444}.progress i.on{background:var(--cyan)}.lineup-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.lineup-card{padding:12px;border:1px solid var(--line);border-radius:15px;background:#111722}.lineup-card.start{border-color:var(--cyan);background:#142537}.lineup-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.lineup-card h3{margin:0;font-size:13px}.lineup-card p{margin:4px 0 0;color:var(--muted);font-size:9px}.lineup-actions{display:grid;grid-template-columns:1.3fr repeat(3,1fr);gap:5px;margin-top:10px}.mini{min-width:0;min-height:38px;padding:0 5px;font-size:9px}.mini.active{border-color:var(--cyan);color:#071019;background:var(--cyan);font-weight:900}.rating-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line)}.rating{padding:16px;background:var(--panel);text-align:center}.rating span{display:block;color:var(--muted);font-size:9px}.rating b{display:block;margin-top:4px;font-size:26px}.rating b.hot{color:var(--cyan)}.hex-rail{display:flex;gap:7px;overflow-x:auto;padding:13px 16px;border-top:1px solid var(--line);scrollbar-width:none}.hex-pill{flex:0 0 auto;padding:7px 9px;border:1px solid var(--line);border-radius:999px;font-size:9px}.record-hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end;padding:22px}.record-hero strong{font-size:clamp(48px,13vw,92px);line-height:.85}.record-hero span{color:var(--muted);font-size:11px}.stage-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:16px}.stage-grid i{height:7px;border-radius:999px;background:#293245}.stage-grid i.on{background:var(--cyan)}.report{margin:0 16px 16px;padding:14px;border-left:3px solid var(--cyan);color:var(--muted);background:#101722;font-size:11px;line-height:1.7}.news{display:grid;gap:7px;margin:0;padding:0;list-style:none}.news li{padding:10px 11px;border:1px solid var(--line);border-radius:11px;color:var(--muted);font-size:10px;line-height:1.5}.table-wrap{overflow-x:auto;overscroll-behavior-x:contain}.data-table{width:100%;min-width:620px;border-collapse:collapse}.data-table th,.data-table td{padding:10px;border-bottom:1px solid var(--line);font-size:10px;text-align:right}.data-table th:first-child,.data-table td:first-child{text-align:left}.series{padding:24px;text-align:center}.series h2{margin:6px 0;font-size:28px}.series-score{display:flex;justify-content:center;gap:28px;margin:18px 0}.series-score b{font-size:64px}.series-score span{display:block;color:var(--muted);font-size:9px}.adjust-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.choice-btn{height:auto;min-height:90px;padding:12px;text-align:left}.choice-btn strong,.choice-btn span{display:block}.choice-btn span{margin-top:6px;color:var(--muted);font-size:9px;line-height:1.5}.result-title{padding:28px;text-align:center;background:linear-gradient(145deg,#1f335a,#111722)}.result-title h1{margin:8px 0;font-size:clamp(42px,13vw,88px);line-height:.9}.result-title .champ{color:var(--gold)}.core-list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:16px}.core-chip{padding:13px;border:1px solid var(--line);border-radius:13px;text-align:center}.core-chip span{color:var(--muted);font-size:9px}.core-chip b{display:block;margin-top:5px;font-size:12px}.tag-list{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:0 16px 18px}.tag-list span{padding:7px 10px;border:1px solid var(--cyan);border-radius:999px;color:var(--cyan);font-size:10px}.history-list{display:grid;gap:8px}.history-item{display:flex;justify-content:space-between;gap:10px;padding:13px;border:1px solid var(--line);border-radius:12px}.history-item span{color:var(--muted);font-size:10px}.history-item b{font-size:12px}.footer-actions{display:flex;flex-wrap:wrap;gap:9px;padding:16px;border-top:1px solid var(--line)}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:calc(24px + var(--safe));z-index:50;transform:translate(-50%,12px);padding:10px 14px;border:1px solid var(--cyan);border-radius:12px;color:var(--text);background:#0d1420;opacity:0;pointer-events:none;transition:.18s}.toast.on{transform:translate(-50%,0);opacity:1}
    @media(max-width:680px){.app{padding:10px 10px calc(82px + var(--safe))}.offer-grid{grid-template-columns:1fr}.player-card p,.hex-card p{min-height:0}.lineup-grid{grid-template-columns:1fr}.rating-grid{grid-template-columns:repeat(2,1fr)}.adjust-grid{grid-template-columns:1fr}.core-list{grid-template-columns:1fr}.top{padding-top:4px}.hero{padding:22px 18px}.panel{border-radius:16px}.record-hero{padding:18px}.stage-grid{gap:3px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main class="app">
    <header class="top"><div><div class="eyebrow">NBA HEX DYNASTY</div><h1 class="brand">海克斯王朝</h1></div><a class="back" href="./">返回总经理模式</a></header>
    <div id="screen"></div>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script src="./hex-engine.js"></script>
  <script>
    const H=globalThis.HexEngine,STORAGE='nba_hex_dynasty_v01',HISTORY='nba_hex_dynasty_history_v01';
    const $=selector=>document.querySelector(selector);let state=null,toastTimer=null;
    const newsTemplates=[
      '{star}连续三场砍下30分，进入MVP讨论。','球队用一波强硬防守终结比赛。','全队今晚命中18记三分。','替补席合计贡献42分。','球队取得本阶段最长连胜。','连续失利让更衣室面临考验。','最后两分钟的执行力决定了胜负。','内线篮板优势成为比赛转折点。','对手针对第一核心展开夹击。','球队在客场完成两位数逆转。',
      '{star}在第四节独得14分。','球队连续四场将对手限制在105分以下。','外线手感冰冷，仍靠防守拿下胜利。','球权分配正在变得更加顺畅。','第二阵容改变了比赛节奏。','球队在焦点战中爆冷击败强敌。','一场大胜让净胜分继续上涨。','双塔阵容控制了禁区。','五小阵容用速度拖垮对手。','媒体开始讨论这支球队的冠军成色。',
      '{star}送出赛季新高的助攻数。','球队遭遇压哨绝杀。','关键防守帮助球队守住一分优势。','连续客场作战带来体能压力。','阵容化学反应达到赛季最佳。','对手放空弱侧射手的策略付出代价。','篮板保护不佳导致二次进攻失分。','球队打出本赛季最高单场得分。','防守轮转速度受到教练组表扬。','常规赛排名竞争进入白热化。'
    ];
    const phaseLabels={draft:'球星选择',hex:'海克斯强化',lineup:'阵容配置',season:'常规赛',playoff_adjust:'季后赛调整',playoffs:'季后赛',result:'王朝结果',history:'历史战绩'};

    function blank(){return{phase:'home',resumePhase:null,roster:[],hexIds:[],starterIds:[],coreIds:[],playerOffer:[],hexOffer:[],hexStep:0,opponents:[],season:null,playoffs:null,result:null,historyShown:false};}
    function load(){try{const raw=localStorage.getItem(STORAGE);return raw?Object.assign(blank(),JSON.parse(raw)):blank();}catch{return blank();}}
    function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state));}catch{}}
    function history(){try{return JSON.parse(localStorage.getItem(HISTORY)||'[]');}catch{return[];}}
    function saveHistory(entry){try{localStorage.setItem(HISTORY,JSON.stringify([entry,...history().filter(item=>item.id!==entry.id)].slice(0,20)));}catch{}}
    function toast(text){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').classList.add('on');toastTimer=setTimeout(()=>$('#toast').classList.remove('on'),1800);}
    function player(id){return H.players.find(p=>p.id===id)}function hex(id){return H.hexes.find(h=>h.id===id)}
    function playerCard(p,action='choose'){return`<button class="player-card" data-${action}-player="${p.id}"><span class="season">${p.season}</span><h3>${p.name}</h3><p>${p.positions.join(' / ')} · ${p.tags.slice(0,3).join(' · ')}</p><span class="tier">${p.tier}</span><div class="stats"><span>攻<b>${Math.round(H.playerOff(p))}</b></span><span>防<b>${Math.round(H.playerDef(p))}</b></span><span>空间<b>${Math.round(H.playerSpace(p))}</b></span><span>组织<b>${Math.round(H.playerCreate(p))}</b></span></div></button>`}
    function hexCard(h){return`<button class="hex-card ${h.quality}" data-choose-hex="${h.id}"><span class="quality">${h.quality}</span><h3>${h.name}</h3><p>${h.description}</p></button>`}
    function progress(){return`<div class="progress">${Array.from({length:8},(_,i)=>`<i class="${i<state.roster.length?'on':''}"></i>`).join('')}</div>`}
    function team(){return H.calculateTeam(state.roster,state.starterIds,state.coreIds,state.hexIds,false)}
    function ratingGrid(t){return`<div class="rating-grid">${[['进攻',t.offense],['防守',t.defense],['空间',t.space],['篮板',t.rebound],['组织',t.playmaking],['化学',t.chemistry]].map(([label,value])=>`<div class="rating"><span>${label}</span><b class="${value>=92?'hot':''}">${value}</b></div>`).join('')}</div>`}
    function hexRail(){return`<div class="hex-rail">${state.hexIds.map(id=>{const h=hex(id);return`<span class="hex-pill ${h.quality}">${h.name}</span>`}).join('')}</div>`}

    function startGame(){state=blank();state.phase='draft';state.playerOffer=H.offerPlayers([]).map(p=>p.id);save();render();}
    function choosePlayer(id){if(state.phase!=='draft'||state.roster.some(p=>p.id===id))return;const p=player(id);if(!p)return;state.roster.push(p);if(state.roster.length%2===0){state.hexStep=state.roster.length/2;state.phase='hex';state.hexOffer=H.offerHexes(state.hexStep,state.hexIds).map(h=>h.id);}else state.playerOffer=H.offerPlayers(state.roster.map(p=>p.id)).map(p=>p.id);save();render();}
    function chooseHex(id){if(state.phase!=='hex'||state.hexIds.includes(id))return;state.hexIds.push(id);if(state.roster.length===8){state.phase='lineup';state.starterIds=state.roster.slice(0,5).map(p=>p.id);state.coreIds=[...state.starterIds].sort((a,b)=>H.playerOff(player(b))-H.playerOff(player(a))).slice(0,3);}else{state.phase='draft';state.playerOffer=H.offerPlayers(state.roster.map(p=>p.id)).map(p=>p.id);}save();render();}
    function toggleStarter(id){const index=state.starterIds.indexOf(id);if(index>=0){state.starterIds.splice(index,1);state.coreIds=state.coreIds.map(core=>core===id?null:core);}else if(state.starterIds.length<5)state.starterIds.push(id);else return toast('首发已经有5人，请先移下一人');save();render();}
    function setCore(slot,id){if(!state.starterIds.includes(id))return toast('只有首发球员可以设为核心');state.coreIds=state.coreIds.map(core=>core===id?null:core);state.coreIds[slot]=id;save();render();}
    function beginSeason(){if(state.starterIds.length!==5||state.coreIds.filter(Boolean).length!==3||new Set(state.coreIds).size!==3)return toast('需要5名首发和3名不同核心');state.phase='season';state.opponents=H.generateOpponents();state.season={games:0,wins:0,losses:0,stage:0,report:'阵容构筑完成，等待常规赛开幕。',news:[],streak:0,stats:Object.fromEntries(state.roster.map(p=>[p.id,{gp:0,pts:0,reb:0,ast:0,stl:0,blk:0,fg:0,three:0}]))};save();render();}
    function simulateStage(){if(state.phase!=='season')return;const targets=[20,41,60,82],target=targets[state.season.stage],t=team();while(state.season.games<target){const opponent=state.opponents[state.season.games%state.opponents.length],result=H.simulateGame(t,opponent,{home:state.season.games%2===0,form:Math.max(-.05,Math.min(.05,state.season.streak*.008))});state.season.games++;if(result.win){state.season.wins++;state.season.streak=state.season.streak>=0?state.season.streak+1:1}else{state.season.losses++;state.season.streak=state.season.streak<=0?state.season.streak-1:-1}const ordered=[...state.coreIds.filter(Boolean),...state.starterIds.filter(id=>!state.coreIds.includes(id)),...state.roster.filter(p=>!state.starterIds.includes(p.id)).map(p=>p.id)];ordered.forEach((id,index)=>{const p=player(id),line=H.playerGameLine(p,index,t);const s=state.season.stats[id];s.gp++;for(const key of ['pts','reb','ast','stl','blk'])s[key]+=line[key];s.fg+=line.fg;s.three+=line.three;});}
      const star=player(state.coreIds[0])?.name||'球队核心',template=newsTemplates[(state.season.wins+state.season.stage*7)%newsTemplates.length];state.season.news.unshift(template.replace('{star}',star));state.season.report=`阶段战绩 ${state.season.wins}-${state.season.losses} · 联盟预计排名第${Math.max(1,Math.round(31-state.season.wins/Math.max(1,state.season.games)*30))} · ${state.season.streak>0?`${state.season.streak}连胜`:state.season.streak<0?`${Math.abs(state.season.streak)}连败`:'状态平稳'}`;state.season.stage++;
      if(state.season.games>=82){if(state.season.wins<41)finishGame(false,'无缘季后赛');else{state.phase='playoff_adjust';state.playoffs={round:0,wins:0,losses:0,totalWins:0,totalLosses:0,adjustment:null,lastGame:null};}}save();render();}
    const roundNames=['首轮','分区半决赛','分区决赛','总决赛'];
    function chooseAdjustment(id){state.playoffs.adjustment=id;state.phase='playoffs';save();render();}
    function playoffTeam(){const t=H.calculateTeam(state.roster,state.starterIds,state.coreIds,state.hexIds,true),adjust=state.playoffs.adjustment;if(adjust==='inside'){t.offense+=3;t.space-=1;t.power+=.8}if(adjust==='short'){t.power+=2.2;t.injuryRisk+=.03}if(adjust==='system'){t.chemistry=Math.min(100,t.chemistry+3);t.power+=.7}if(state.playoffs.godsPenalty){t.chemistry=Math.max(40,t.chemistry+state.playoffs.godsPenalty);t.power+=state.playoffs.godsPenalty*.12}return t;}
    function simulatePlayoffGame(){const p=state.playoffs,t=playoffTeam(),powers=[86,89,92,94],opponent={name:`${roundNames[p.round]}对手`,power:powers[p.round]+(Math.random()-.5)*3,style:H.sample(['SHOOTING','DEFENSE','SMALL_BALL','TWIN_TOWERS','BALANCED'],1)[0]};const result=H.simulateGame(t,opponent,{home:(p.wins+p.losses)%2===0,playoffs:true});if(result.win){p.wins++;p.totalWins++}else{p.losses++;p.totalLosses++}p.lastGame=`${result.win?'W':'L'} ${result.own}-${result.opp} · ${player(state.coreIds[0]).name}领衔`;
      if(!result.win&&state.hexIds.includes('gods'))p.godsPenalty=(p.godsPenalty||0)-3;if(p.wins===4){p.round++;if(p.round===4)return finishGame(true,'NBA CHAMPION');p.wins=0;p.losses=0;p.adjustment=null;state.phase='playoff_adjust';}else if(p.losses===4)return finishGame(false,`${roundNames[p.round]}出局`);save();render();}
    function finishGame(champion,playoffResult){const t=H.calculateTeam(state.roster,state.starterIds,state.coreIds,state.hexIds,true),stats=state.season.stats,byScore=(p)=>{const s=stats[p.id];return s.gp?(s.pts+s.reb*.7+s.ast*.8+s.stl*2+s.blk*2)/s.gp:0},scorer=[...state.roster].sort((a,b)=>(stats[b.id].pts/stats[b.id].gp)-(stats[a.id].pts/stats[a.id].gp))[0],mvp=[...state.roster].sort((a,b)=>byScore(b)-byScore(a))[0],dpoy=[...state.roster].sort((a,b)=>H.playerDef(b)-H.playerDef(a))[0];state.phase='result';state.result={id:`hex_${Date.now()}`,champion,playoffResult,ratings:t,leagueRank:H.clamp(Math.round(17-(state.season.wins-41)*.45),1,30),awards:{mvp:mvp.id,dpoy:dpoy.id,scorer:scorer.id,fmvp:champion?state.coreIds[0]:null},tags:H.evaluateTags(t,{wins:state.season.wins},champion)};const entry={id:state.result.id,timestamp:Date.now(),roster:state.roster.map(p=>p.id),starters:[...state.starterIds],cores:[...state.coreIds],hexes:[...state.hexIds],record:{wins:state.season.wins,losses:state.season.losses},playoffResult,ratings:t,tags:state.result.tags};saveHistory(entry);save();render();}

    function renderHome(){const games=history();return`<section class="panel"><div class="hero"><div class="eyebrow">BUILD · ADAPT · CONQUER</div><h1>NBA HEX<br>DYNASTY</h1><p>随机球星三选一，构筑8人阵容，获取4次海克斯强化。用球权、空间、防守与化学反应打造一支真正能夺冠的球队。</p><div class="hero-actions"><button class="primary" data-start>开始新王朝</button>${state.resumePhase&&state.resumePhase!=='home'?'<button class="ghost" data-continue>继续游戏</button>':''}<button class="ghost" data-history>历史战绩 ${games.length}</button></div></div></section>`}
    function renderDraft(){return`<section class="panel"><div class="section-head"><div><div class="eyebrow">DRAFT ${state.roster.length+1}/8</div><h2>选择一名巅峰球星</h2></div>${progress()}</div><div class="content offer-grid">${state.playerOffer.map(id=>playerCard(player(id))).join('')}</div>${state.roster.length?`<div class="hex-rail">${state.roster.map(p=>`<span class="hex-pill">${p.season} ${p.name}</span>`).join('')}</div>`:''}</section>`}
    function renderHex(){return`<section class="panel"><div class="section-head"><div><div class="eyebrow">AUGMENT ${state.hexStep}/4</div><h2>选择一次海克斯强化</h2></div>${progress()}</div><div class="content offer-grid">${state.hexOffer.map(id=>hexCard(hex(id))).join('')}</div>${hexRail()}</section>`}
    function renderLineup(){const t=team(),valid=state.starterIds.length===5&&state.coreIds.filter(Boolean).length===3&&new Set(state.coreIds).size===3;return`<section class="panel"><div class="section-head"><div><div class="eyebrow">LINEUP LAB</div><h2>设置首发与前三核心</h2></div><span>${state.starterIds.length}/5首发 · ${state.coreIds.filter(Boolean).length}/3核心</span></div>${ratingGrid(t)}<div class="content lineup-grid">${state.roster.map(p=>{const start=state.starterIds.includes(p.id);return`<article class="lineup-card ${start?'start':''}"><div class="lineup-card-head"><div><h3>${p.season} ${p.name}</h3><p>${p.positions.join('/')} · ${p.tier}</p></div><b>${Math.round(H.playerOff(p))}</b></div><div class="lineup-actions"><button class="mini ${start?'active':''}" data-starter="${p.id}">${start?'首发':'替补'}</button>${[0,1,2].map(i=>`<button class="mini ${state.coreIds[i]===p.id?'active':''}" data-core-slot="${i}" data-core-player="${p.id}" ${start?'':'disabled'}>核${i+1}</button>`).join('')}</div></article>`}).join('')}</div>${hexRail()}<div class="footer-actions"><button class="primary" data-begin-season ${valid?'':'disabled'}>开始82场常规赛</button></div></section>`}
    function statsTable(){const ordered=[...state.roster].sort((a,b)=>(state.season.stats[b.id]?.pts||0)-(state.season.stats[a.id]?.pts||0));return`<div class="table-wrap"><table class="data-table"><thead><tr><th>球员</th><th>场次</th><th>得分</th><th>篮板</th><th>助攻</th><th>抢断</th><th>盖帽</th><th>命中率</th><th>三分</th></tr></thead><tbody>${ordered.map(p=>{const s=state.season.stats[p.id],d=n=>s.gp?(n/s.gp).toFixed(1):'0.0';return`<tr><td>${p.season} ${p.name}</td><td>${s.gp}</td><td>${d(s.pts)}</td><td>${d(s.reb)}</td><td>${d(s.ast)}</td><td>${d(s.stl)}</td><td>${d(s.blk)}</td><td>${s.gp?Math.round(s.fg/s.gp*100):0}%</td><td>${s.gp?Math.round(s.three/s.gp*100):0}%</td></tr>`}).join('')}</tbody></table></div>`}
    function renderSeason(){const t=team(),targets=[20,41,60,82];return`<section class="panel"><div class="record-hero"><div><div class="eyebrow">REGULAR SEASON · ${state.season.games}/82</div><strong>${state.season.wins}-${state.season.losses}</strong><div class="stage-grid">${targets.map((target,i)=>`<i class="${i<state.season.stage?'on':''}"></i>`).join('')}</div></div><span>阶段 ${Math.min(4,state.season.stage+1)}/4</span></div><p class="report">${state.season.report}</p>${ratingGrid(t)}<div class="content"><ul class="news">${state.season.news.slice(0,4).map(text=>`<li>${text}</li>`).join('')||'<li>赛季新闻将在模拟后出现。</li>'}</ul></div>${statsTable()}${hexRail()}<div class="footer-actions"><button class="primary" data-sim-stage>模拟第${state.season.stage+1}阶段（至${targets[state.season.stage]}场）</button></div></section>`}
    function renderAdjust(){return`<section class="panel"><div class="section-head"><div><div class="eyebrow">PLAYOFFS · ${roundNames[state.playoffs.round]}</div><h2>系列赛前调整</h2></div><span>BO7</span></div><div class="content adjust-grid"><button class="choice-btn" data-adjust="inside"><strong>增加内线进攻</strong><span>终结＋3，空间－1</span></button><button class="choice-btn" data-adjust="short"><strong>缩短轮换</strong><span>主力权重＋10%，伤病风险提高</span></button><button class="choice-btn" data-adjust="system"><strong>坚持体系</strong><span>化学反应＋3</span></button></div></section>`}
    function renderPlayoffs(){const p=state.playoffs;return`<section class="panel"><div class="series"><div class="eyebrow">${roundNames[p.round]} · BEST OF 7</div><h2>你的王朝 VS ${roundNames[p.round]}对手</h2><div class="series-score"><div><span>你的球队</span><b>${p.wins}</b></div><div><span>对手</span><b>${p.losses}</b></div></div><p class="report">${p.lastGame||'系列赛等待开打。'}</p><button class="primary" data-sim-playoff>模拟下一场</button></div>${ratingGrid(playoffTeam())}${hexRail()}</section>`}
    function renderResult(){const r=state.result,a=r.awards||{};return`<section class="panel"><div class="result-title"><div class="eyebrow">DYNASTY RESULT · 联盟第${r.leagueRank||'-'}</div><h1>${state.season.wins}-${state.season.losses}</h1><h2 class="${r.champion?'champ':''}">${r.playoffResult}</h2></div>${ratingGrid(r.ratings)}<div class="core-list">${state.coreIds.map((id,i)=>`<div class="core-chip"><span>第${i+1}核心</span><b>${player(id).season} ${player(id).name}</b></div>`).join('')}</div><div class="content"><ul class="news"><li>球队MVP：${a.mvp?player(a.mvp).name:'—'}</li><li>最佳防守球员：${a.dpoy?player(a.dpoy).name:'—'}</li><li>得分王：${a.scorer?player(a.scorer).name:'—'}</li>${a.fmvp?`<li>总决赛MVP：${player(a.fmvp).name}</li>`:''}</ul></div><div class="tag-list">${r.tags.map(tag=>`<span>${tag}</span>`).join('')}</div>${hexRail()}<div class="footer-actions"><button class="primary" data-share>保存战绩图</button><button class="ghost" data-start>再来一局</button><button class="ghost" data-home>返回首页</button></div></section>`}
    function renderHistory(){const games=history();return`<section class="panel"><div class="section-head"><div><div class="eyebrow">LOCAL HISTORY</div><h2>最近20局</h2></div><span>${games.length}局</span></div><div class="content history-list">${games.map(item=>`<div class="history-item"><div><b>${item.record.wins}-${item.record.losses} · ${item.playoffResult}</b><br><span>${item.tags.join(' · ')}</span></div><span>${new Date(item.timestamp).toLocaleDateString()}</span></div>`).join('')||'<div class="report">还没有完成的王朝。</div>'}</div><div class="footer-actions"><button class="ghost" data-home>返回首页</button></div></section>`}
    function render(){if(!state)state=load();let html='';if(state.phase==='home')html=renderHome();if(state.phase==='draft')html=renderDraft();if(state.phase==='hex')html=renderHex();if(state.phase==='lineup')html=renderLineup();if(state.phase==='season')html=renderSeason();if(state.phase==='playoff_adjust')html=renderAdjust();if(state.phase==='playoffs')html=renderPlayoffs();if(state.phase==='result')html=renderResult();if(state.phase==='history')html=renderHistory();$('#screen').innerHTML=html;bind();}
    function bind(){document.querySelectorAll('[data-start]').forEach(b=>b.addEventListener('click',startGame));document.querySelectorAll('[data-continue]').forEach(b=>b.addEventListener('click',()=>{state.phase=state.resumePhase||'draft';state.resumePhase=null;save();render()}));document.querySelectorAll('[data-home]').forEach(b=>b.addEventListener('click',()=>{if(!['home','history'].includes(state.phase))state.resumePhase=state.phase;state.phase='home';save();render()}));document.querySelectorAll('[data-history]').forEach(b=>b.addEventListener('click',()=>{if(state.phase!=='home')state.resumePhase=state.phase;state.phase='history';save();render()}));document.querySelectorAll('[data-choose-player]').forEach(b=>b.addEventListener('click',()=>choosePlayer(b.dataset.choosePlayer)));document.querySelectorAll('[data-choose-hex]').forEach(b=>b.addEventListener('click',()=>chooseHex(b.dataset.chooseHex)));document.querySelectorAll('[data-starter]').forEach(b=>b.addEventListener('click',()=>toggleStarter(b.dataset.starter)));document.querySelectorAll('[data-core-slot]').forEach(b=>b.addEventListener('click',()=>setCore(Number(b.dataset.coreSlot),b.dataset.corePlayer)));$('[data-begin-season]')?.addEventListener('click',beginSeason);$('[data-sim-stage]')?.addEventListener('click',simulateStage);document.querySelectorAll('[data-adjust]').forEach(b=>b.addEventListener('click',()=>chooseAdjustment(b.dataset.adjust)));$('[data-sim-playoff]')?.addEventListener('click',simulatePlayoffGame);$('[data-share]')?.addEventListener('click',exportShareCard);}
    function exportShareCard(){const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1440;const c=canvas.getContext('2d'),r=state.result;c.fillStyle='#0b0e14';c.fillRect(0,0,1080,1440);c.fillStyle='#39d9ff';c.font='700 42px sans-serif';c.fillText('NBA HEX DYNASTY',70,100);c.fillStyle='#f5f7fb';c.font='900 150px sans-serif';c.fillText(`${state.season.wins}-${state.season.losses}`,70,290);c.fillStyle=r.champion?'#f1bd55':'#f5f7fb';c.font='800 62px sans-serif';c.fillText(r.playoffResult,70,390);c.fillStyle='#98a4b8';c.font='32px sans-serif';c.fillText('核心阵容',70,500);c.fillStyle='#f5f7fb';c.font='700 38px sans-serif';state.coreIds.forEach((id,i)=>c.fillText(`${i+1}. ${player(id).season} ${player(id).name}`,70,570+i*65));c.fillStyle='#98a4b8';c.font='32px sans-serif';c.fillText('海克斯',70,800);c.fillStyle='#f5f7fb';c.font='700 34px sans-serif';state.hexIds.forEach((id,i)=>c.fillText(`◆ ${hex(id).name}`,70,865+i*58));c.fillStyle='#39d9ff';c.font='700 38px sans-serif';c.fillText(r.tags.join(' · '),70,1180);c.fillStyle='#98a4b8';c.font='28px sans-serif';c.fillText(`进攻 ${r.ratings.offense}  防守 ${r.ratings.defense}  空间 ${r.ratings.space}`,70,1280);const url=canvas.toDataURL('image/png'),preview=document.createElement('div');preview.className='share-preview';preview.innerHTML=`<div class="share-preview-card"><img src="${url}" alt="NBA海克斯王朝战绩图"><p>手机端可长按图片保存，或点击下方下载。</p><div class="share-preview-actions"><a class="primary" href="${url}" download="NBA海克斯王朝战绩.png">下载图片</a><button class="ghost" type="button">关闭</button></div></div>`;preview.querySelector('button').addEventListener('click',()=>preview.remove());document.body.appendChild(preview);toast('战绩图已生成');}
    state=load();if(state.phase==='history')state.phase='home';render();
  </script>
</body>
</html>
