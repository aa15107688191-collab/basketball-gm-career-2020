<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e8dcc7">
  <meta name="description" content="选择现代总经理生涯或NBA海克斯王朝，开始你的篮球管理游戏。">
  <title>NBA生涯游戏</title>
  <style>
    :root{--sand:#e8dcc7;--oat:#d4b895;--clay:#b08b6e;--terracotta:#c66b3d;--moss:#606c38;--ink:#45392e;--soft:#786756;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
    *{box-sizing:border-box}
    html{min-height:100%;overflow-x:hidden;background:var(--sand);color:var(--ink)}
    body{min-height:100vh;min-height:100dvh;margin:0;font-family:Epilogue,"Avenir Next","Microsoft YaHei UI",sans-serif;background:linear-gradient(145deg,var(--sand),var(--oat));color:var(--ink)}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:radial-gradient(rgba(69,57,46,.32) .7px,transparent .7px);background-size:7px 7px}
    a{color:inherit}
    .hub{position:relative;width:min(1180px,100%);min-height:100vh;min-height:100dvh;margin:auto;padding:calc(26px + var(--safe-top)) 22px calc(28px + var(--safe-bottom));display:grid;grid-template-rows:auto 1fr auto;gap:24px}
    .masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding-bottom:18px;border-bottom:1px solid rgba(69,57,46,.28)}
    .brand{margin:0;font-size:15px;font-weight:800;letter-spacing:.14em}
    .version{font-size:12px;color:var(--soft)}
    .intro{display:grid;grid-template-columns:minmax(0,.75fr) minmax(520px,1.25fr);gap:clamp(28px,6vw,82px);align-items:center}
    .copy h1{max-width:600px;margin:0;font-size:clamp(48px,8vw,104px);line-height:.9;letter-spacing:-.07em}
    .copy p{max-width:520px;margin:24px 0 0;color:var(--soft);font-size:clamp(14px,1.7vw,18px);line-height:1.75}
    .court{position:relative;display:grid;grid-template-columns:1fr 1fr;min-height:510px;border:2px solid rgba(69,57,46,.38);border-radius:32px;overflow:hidden;box-shadow:0 26px 70px rgba(69,57,46,.15)}
    .court::before{content:"";position:absolute;z-index:2;top:0;bottom:0;left:50%;width:2px;background:rgba(69,57,46,.32);transform:translateX(-1px);pointer-events:none}
    .court::after{content:"";position:absolute;z-index:2;top:50%;left:50%;width:112px;height:112px;border:2px solid rgba(69,57,46,.32);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;animation:breathe 4s ease-in-out infinite}
    .mode{position:relative;min-width:0;padding:32px 28px;display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;transition:transform .4s ease,filter .4s ease}
    .mode:hover,.mode:focus-visible{z-index:3;transform:translateY(-6px);filter:saturate(1.08)}
    .mode:focus-visible{outline:3px solid var(--ink);outline-offset:-6px}
    .mode-gm{background:var(--terracotta);color:var(--sand)}
    .mode-hex{background:var(--moss);color:var(--sand)}
    .mode-number{display:block;font-size:12px;font-weight:800;letter-spacing:.18em;opacity:.8}
    .mode h2{max-width:330px;margin:18px 0 14px;font-size:clamp(30px,4vw,54px);line-height:.94;letter-spacing:-.045em}
    .mode p{max-width:360px;margin:0;font-size:13px;line-height:1.75;opacity:.86}
    .facts{display:flex;flex-wrap:wrap;gap:7px;margin:24px 0 0;padding:0;list-style:none}
    .facts li{padding:7px 9px;border:1px solid currentColor;border-radius:999px;font-size:10px;opacity:.84}
    .enter{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:54px;margin-top:34px;padding-top:17px;border-top:1px solid currentColor;font-size:14px;font-weight:800}
    .enter::after{content:"";width:34px;height:12px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:skewX(-42deg);transition:transform .4s ease}
    .mode:hover .enter::after,.mode:focus-visible .enter::after{transform:translateX(8px) skewX(-42deg)}
    .foot{display:flex;justify-content:space-between;gap:20px;color:var(--soft);font-size:11px;line-height:1.6}
    @keyframes breathe{50%{transform:translate(-50%,-50%) scale(1.08);opacity:.58}}
    @media(max-width:900px){.intro{grid-template-columns:1fr}.copy h1{max-width:760px}.court{min-height:480px}}
    @media(max-width:620px){.hub{padding-left:12px;padding-right:12px;gap:18px}.masthead{align-items:center}.intro{gap:22px}.copy h1{font-size:clamp(48px,17vw,76px)}.copy p{margin-top:16px;font-size:13px}.court{grid-template-columns:1fr;min-height:0;border-radius:24px}.court::before{top:50%;right:0;bottom:auto;left:0;width:auto;height:2px;transform:translateY(-1px)}.court::after{width:80px;height:80px}.mode{min-height:330px;padding:25px 22px}.mode h2{font-size:34px}.enter{margin-top:24px}.foot{display:block}.foot span{display:block;margin-top:4px}}
    @media(prefers-reduced-motion:reduce){.court::after{animation:none}.mode,.enter::after{transition:none}}
  </style>
</head>
<body>
  <main class="hub">
    <header class="masthead"><p class="brand">NBA 生涯游戏</p><span class="version">两种模式</span></header>
    <section class="intro" aria-labelledby="hubTitle">
      <div class="copy"><h1 id="hubTitle">选择你的<br>管理方式</h1><p>经营一支球队的长期生涯，或用球星与海克斯完成一次王朝构筑。</p></div>
      <div class="court" aria-label="游戏模式">
        <a class="mode mode-gm" href="./gm.html?v=15"><div><span class="mode-number">01 · 长期经营</span><h2>现代总经理生涯</h2><p>从2020休赛期开始，选择30支球队之一，处理阵容、交易、签约、选秀和老板目标。</p><ul class="facts"><li>30支球队</li><li>现实球员为主</li><li>多赛季经营</li></ul></div><span class="enter">进入总经理模式</span></a>
        <a class="mode mode-hex" href="./hex.html?v=15"><div><span class="mode-number">02 · 单局构筑</span><h2>NBA海克斯王朝</h2><p>球星三选一，组成8人阵容并获得4次海克斯强化，通过Build、羁绊和季后赛调整冲击冠军。</p><ul class="facts"><li>8人阵容</li><li>4次强化</li><li>挑战码与每日挑战</li></ul></div><span class="enter">进入海克斯模式</span></a>
      </div>
    </section>
    <footer class="foot"><span>存档保存在当前设备，进入模式后会自动读取已有进度。</span><span>支持手机与桌面端</span></footer>
  </main>
</body>
</html>
